<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Poland Journey</title>
  <link rel="stylesheet" href="css/style.css?v=8">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">

    <div id="header">
      <h1>My Poland Journey</h1>
      <p>Jewish Life and the Holocaust — Click a city to learn its history</p>
    </div>

    <!-- Map controls -->
    <div id="controls">
      <button id="find-nearest-btn">Find Nearest Places</button>
    </div>

    <!-- Account button -->
    <button id="account-btn" aria-label="Account">
      <img src="assets/profile-circle.svg" alt="Account" class="account-icon">
    </button>

    <!-- All Content button -->
    <button id="all-content-btn" aria-label="Browse all content">All Content</button>

    <!-- Hint shown while in select mode -->
    <div id="select-hint">Click anywhere on the map to find the 5 nearest places</div>

    <div id="map"></div>

    <!-- Overlay to close panel on map click -->
    <div id="map-overlay"></div>

    <!-- Nearest-places results panel -->
    <div id="nearest-panel">
      <div id="nearest-header">
        <button id="close-nearest" aria-label="Close">×</button>
        <h2>Nearest Places</h2>
        <p id="nearest-subtitle"></p>
      </div>
      <ul id="nearest-list"></ul>
    </div>

    <!-- All Content panel -->
    <div id="content-panel">
      <div id="content-header">
        <button id="close-content" aria-label="Close">×</button>
        <h2>All Content</h2>
        <button id="refresh-content" aria-label="Refresh" title="Shuffle content">⟳</button>
      </div>
      <div id="content-list"></div>
    </div>

    <!-- Account panel -->
    <div id="account-panel">
      <div id="account-header">
        <button id="close-account" aria-label="Close">×</button>
        <h2>Account</h2>
      </div>
      <div id="account-body"></div>
    </div>

    <!-- Info panel -->
    <div id="info-panel">
      <div id="panel-header">
        <button id="close-panel" aria-label="Close">×</button>
        <span id="panel-type-badge"></span>
        <h2 id="panel-name"></h2>
      </div>
      <div class="tab-bar">
        <button class="tab-button active" data-tab="history">History</button>
        <button class="tab-button" data-tab="short-videos">Short Videos</button>
        <button class="tab-button" data-tab="full-testimonials">Full Testimonials</button>
      </div>
      <div id="panel-body">
        <div class="tab-pane" id="tab-history">
          <div id="panel-content"></div>
        </div>
        <div class="tab-pane hidden" id="tab-short-videos">
          <div id="panel-short-videos"></div>
        </div>
        <div class="tab-pane hidden" id="tab-full-testimonials">
          <div id="panel-full-testimonials"></div>
        </div>
      </div>
      <div id="panel-footer">
        <a id="panel-source" target="_blank" rel="noopener"></a>
      </div>
    </div>

    <!-- Legend -->
    <div id="legend">
      <div class="legend-label">Map Key</div>
      <div class="legend-item"><span class="dot community"></span> Jewish Community</div>
      <div class="legend-item"><span class="dot ghetto"></span> Ghetto</div>
      <div class="legend-item"><span class="dot camp"></span> Extermination / Concentration Camp</div>
      <div class="legend-item"><span class="legend-dash"></span> 1939 Borders</div>
    </div>

  </div>
  <script src="js/auth.js?v=8"></script>
  <script src="js/map.js?v=8"></script>
</body>
</html>
